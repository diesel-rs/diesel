on:
  merge_group:
    types: [checks_requested]
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - 0.7.x
      - 0.6.x
      - 0.5.x
      - 0.3.x
      - 0.4.x
      - 0.2.x

name: CI Tests
permissions:
  contents: "read"
env:
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  # Force HTTP/1.1 for crates.io downloads: HTTP/2 multiplexing against the
  # CDN intermittently drops connections mid-stream (SSL "unexpected eof"),
  # and cargo does not retry those, so CARGO_NET_RETRY alone cannot recover.
  CARGO_HTTP_MULTIPLEXING: "false"

# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions#concurrency.
# This will ensure that only one commit will be running tests at a time on each PR.
concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  check_and_test:
    name: Check
    strategy:
      fail-fast: false
      matrix:
        rust: ["stable"]
        backend: ["postgres", "mysql", "sqlite", "mariadb"]
        os:
          [
            ubuntu-latest,
            macos-15-intel,
            macos-26,
            windows-latest,
            ubuntu-24.04-arm,
          ]
        exclude:
          - rust: "stable"
            backend: "postgres"
            os: "ubuntu-latest"
        include:
          # Adding two extra jobs for the single one exlucded above with pinned postgres versions
          # as there is a change in behaviour (see `restrict_violation_error_kind` test)
          - rust: "stable"
            backend: "postgres"
            os: "ubuntu-latest"
            pg_version: "17"
          - rust: "stable"
            backend: "postgres"
            os: "ubuntu-latest"
            pg_version: "18"
          - rust: "beta"
            backend: "postgres"
            os: "ubuntu-latest"
          - rust: "beta"
            backend: "sqlite"
            os: "ubuntu-latest"
          - rust: "beta"
            backend: "mysql"
            os: "ubuntu-latest"
          - rust: "nightly"
            backend: "postgres"
            os: "ubuntu-latest"
          - rust: "nightly"
            backend: "sqlite"
            os: "ubuntu-latest"
          - rust: "nightly"
            backend: "mysql"
            os: "ubuntu-latest"
          - rust: "nightly"
            backend: "mariadb"
            os: "ubuntu-latest"
          - rust: "beta"
            backend: "mariadb"
            os: "ubuntu-latest"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@f51f967e158417aafa338a1e46ab22095f07aa01 # v2.8.2
        with:
          key: ${{ runner.os }}-${{ matrix.backend }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Set environment variables
        shell: bash
        if: matrix.backend == 'mysql' || matrix.backend == 'mariadb'
        run: |
          echo "RUST_TEST_THREADS=1" >> $GITHUB_ENV

      - name: Set environment variables
        shell: bash
        if: matrix.backend == 'postgres' && matrix.os == 'windows-latest'
        run: |
          echo "AWS_LC_SYS_NO_ASM=1"

      - name: Set environment variables
        shell: bash
        if: matrix.rust != 'nightly'
        run: |
          echo "RUSTFLAGS=-D warnings" >> $GITHUB_ENV
          echo "RUSTDOCFLAGS=-D warnings" >> $GITHUB_ENV

      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        if: matrix.backend == 'postgres' && matrix.os == 'windows-latest'

      - name: Install postgres (Linux)
        if: runner.os == 'Linux' && matrix.backend == 'postgres'
        env:
          PG_VERSION: ${{ matrix.pg_version }}
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          if [ -n "$PG_VERSION" ]; then
            # See https://www.postgresql.org/download/linux/ubuntu/
            sudo apt-get -o DPkg::Lock::Timeout=300 install -y postgresql-common
            sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
            sudo apt-get -o DPkg::Lock::Timeout=300 install -y "postgresql-$PG_VERSION"
            sudo pg_dropcluster --stop "$PG_VERSION" main 2>/dev/null || true
            sudo pg_createcluster "$PG_VERSION" main
            sudo pg_ctlcluster --skip-systemctl-redirect "$PG_VERSION" main start
            port=$(pg_lsclusters -h | awk -v v="$PG_VERSION" '$1 == v {print $3}')
          else
            sudo apt-get -o DPkg::Lock::Timeout=300 install -y postgresql
            sudo service postgresql restart
            port=5432
          fi
          sleep 3
          sudo -u postgres psql -p "$port" -c "ALTER USER postgres PASSWORD 'postgres';"
          echo "DATABASE_URL=postgres://postgres:postgres@localhost:$port/" >> "$GITHUB_ENV"

      - name: Install mysql (Linux)
        if: runner.os == 'Linux' && matrix.backend == 'mysql'
        run: |
          sudo systemctl start mysql.service
          mysql -e "create database diesel_test; create database diesel_unit_test; grant all on \`diesel_%\`.* to 'root'@'localhost';" -uroot -proot
          echo "DATABASE_URL=mysql://root:root@localhost/diesel_test" >> $GITHUB_ENV

      - name: Install mariadb (Linux)
        if: runner.os == 'Linux' && matrix.backend == 'mariadb'
        run: |
          # apt ships only MariaDB 10.x, so the 13.0 server comes from the official image
          docker run -d --name mariadb13 -e MARIADB_ROOT_PASSWORD=root -p 3306:3306 mariadb:13.0
          # -h forces a TCP ping, which only succeeds once the entrypoint's init server is gone
          for i in $(seq 1 60); do
            if docker exec mariadb13 mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for MariaDB 13 to accept connections ($i)..."
            sleep 2
          done
          docker exec mariadb13 mariadb-admin ping -h 127.0.0.1 -uroot -proot --silent >/dev/null 2>&1 || { echo "MariaDB 13 did not become ready in time"; docker logs mariadb13; exit 1; }
          docker exec mariadb13 mariadb -uroot -proot -e "create database diesel_test; create database diesel_unit_test;"
          docker exec mariadb13 mariadb -h 127.0.0.1 -uroot -proot -e "SELECT VERSION();"
          echo "DATABASE_URL=mariadb://root:root@localhost/diesel_test" >> $GITHUB_ENV
          

      - name: Install sqlite (Linux)
        if: runner.os == 'Linux' && matrix.backend == 'sqlite'
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install libsqlite3-dev
          echo "DATABASE_URL=:memory:" >> $GITHUB_ENV

      - name: Install postgres (MacOS)
        if: runner.os == 'macOS' && matrix.backend == 'postgres'
        run: |
          brew install postgresql@14
          brew services restart postgresql@14
          sleep 3
          createuser -s postgres
          echo "DATABASE_URL=postgres://postgres@localhost/" >> $GITHUB_ENV

      - name: Install sqlite (MacOS)
        if: runner.os == 'macOS' && matrix.backend == 'sqlite'
        run: |
          brew install sqlite
          echo "DATABASE_URL=:memory:" >> $GITHUB_ENV

      - name: Install mysql (MacOS Intel)
        if: matrix.os == 'macos-15-intel' && matrix.backend == 'mysql'
        run: |
          brew install mariadb@11.4
          /usr/local/opt/mariadb@11.4/bin/mysql_install_db
          /usr/local/opt/mariadb@11.4/bin/mysql.server start
          sleep 3
          /usr/local/opt/mariadb@11.4/bin/mysqladmin -u runner password diesel
          /usr/local/opt/mariadb@11.4/bin/mysql -e "create database diesel_test; create database diesel_unit_test; grant all on \`diesel_%\`.* to 'runner'@'localhost';" -urunner
          echo "DATABASE_URL=mysql://runner:diesel@localhost/diesel_test" >> $GITHUB_ENV
          
      - name: Install mariadb (MacOS Intel)
        if: matrix.os == 'macos-15-intel' && matrix.backend == 'mariadb'
        run: |
          brew install mariadb@11.4
          /usr/local/opt/mariadb@11.4/bin/mysql_install_db
          /usr/local/opt/mariadb@11.4/bin/mysql.server start
          sleep 3
          /usr/local/opt/mariadb@11.4/bin/mysqladmin -u runner password diesel
          /usr/local/opt/mariadb@11.4/bin/mysql -e "create database diesel_test; create database diesel_unit_test; grant all on \`diesel_%\`.* to 'runner'@'localhost';" -urunner
          echo "DATABASE_URL=mariadb://runner:diesel@localhost/diesel_test" >> $GITHUB_ENV

      - name: Install mysql (MacOS M1)
        if: matrix.os == 'macos-26' && matrix.backend == 'mysql'
        run: |
          brew install mariadb@11.4
          ls /opt/homebrew/opt/mariadb@11.4
          /opt/homebrew/opt/mariadb@11.4/bin/mysql_install_db
          /opt/homebrew/opt/mariadb@11.4/bin/mysql.server start
          sleep 3
          /opt/homebrew/opt/mariadb@11.4/bin/mysqladmin -u runner password diesel
          /opt/homebrew/opt/mariadb@11.4/bin/mysql -e "create database diesel_test; create database diesel_unit_test; grant all on \`diesel_%\`.* to 'runner'@'localhost';" -urunner
          echo "DATABASE_URL=mysql://runner:diesel@localhost/diesel_test" >> $GITHUB_ENV
          
      - name: Install mariadb (MacOS M1)
        if: matrix.os == 'macos-26' && matrix.backend == 'mariadb'
        run: |
          brew install mariadb@11.4
          ls /opt/homebrew/opt/mariadb@11.4
          /opt/homebrew/opt/mariadb@11.4/bin/mysql_install_db
          /opt/homebrew/opt/mariadb@11.4/bin/mysql.server start
          sleep 3
          /opt/homebrew/opt/mariadb@11.4/bin/mysqladmin -u runner password diesel
          /opt/homebrew/opt/mariadb@11.4/bin/mysql -e "create database diesel_test; create database diesel_unit_test; grant all on \`diesel_%\`.* to 'runner'@'localhost';" -urunner
          echo "DATABASE_URL=mariadb://runner:diesel@localhost/diesel_test" >> $GITHUB_ENV

      - name: Start postgres (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'postgres'
        shell: pwsh
        run: |
          Set-Service -Name postgresql-x64-17 -StartupType Manual
          Start-Service -Name postgresql-x64-17
          "DATABASE_URL=postgres://postgres:root@localhost/" >> $env:GITHUB_ENV

      - name: Install mysql (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'mysql'
        shell: bash
        run: |
          # The runner image installs one MySQL server, under a directory named after its version
          shopt -s nullglob
          mysql_dirs=("/c/Program Files/MySQL/MySQL Server "*/)
          mysql_dir=${mysql_dirs[0]:?no MySQL server found under C:/Program Files/MySQL}
          mkdir "${mysql_dir}data"
          "${mysql_dir}bin/mysqld" --console --initialize --initialize-insecure
          "${mysql_dir}bin/mysqld" --console &
          sleep 15
          "${mysql_dir}bin/mysql" -e "create database diesel_test;" -u root
          "${mysql_dir}bin/mysql" -e "create database diesel_unit_test;" -u root
          "${mysql_dir}bin/mysql" -e 'grant all on `diesel_%`.* to 'root'@'localhost';' -uroot
          
      - name: Install mariadb (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'mariadb'
        shell: bash
        run: |
          # community.chocolatey.org intermittently answers 504, so the install is retried
          for attempt in 1 2 3 4; do
            choco install mariadb --version=12.3.2 -y && break
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 30))
          done
          "C:\\Program Files\\MariaDB 12.3\\bin\\mariadb" -e "create database diesel_test;" -u root
          "C:\\Program Files\\MariaDB 12.3\\bin\\mariadb" -e "create database diesel_unit_test;" -u root
          "C:\\Program Files\\MariaDB 12.3\\bin\\mariadb" -e 'grant all on `diesel_%`.* to 'root'@'localhost';' -uroot

      - name: Set variables for mysql (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'mysql'
        shell: bash
        run: |
          echo "DATABASE_URL=mysql://root@localhost/diesel_test" >> $GITHUB_ENV
          
      - name: Set variables for mariadb (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'mariadb'
        shell: bash
        run: |
          echo "DATABASE_URL=mariadb://root@localhost/diesel_test" >> $GITHUB_ENV

      - name: Install sqlite (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'sqlite'
        shell: bash
        run: |
          # community.chocolatey.org intermittently answers 504, so the install is retried
          for attempt in 1 2 3 4; do
            choco install sqlite -y && break
            if [ "$attempt" -eq 4 ]; then exit 1; fi
            sleep $((attempt * 30))
          done

      - name: Build sqlite import library (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'sqlite'
        shell: cmd
        run: |
          cd /D C:\ProgramData\chocolatey\lib\SQLite\tools
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -prerelease -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          lib /machine:x64 /def:sqlite3.def /out:sqlite3.lib

      - name: Set variables for sqlite (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'sqlite'
        shell: bash
        run: |
          echo "C:\ProgramData\chocolatey\lib\SQLite\tools" >> $GITHUB_PATH
          echo "SQLITE3_LIB_DIR=C:\ProgramData\chocolatey\lib\SQLite\tools" >> $GITHUB_ENV
          echo "DATABASE_URL=:memory:" >> $GITHUB_ENV

      - name: Rust version check
        env:
          RUST: ${{ matrix.rust }}
        run: |
          rustup override set $RUST
          cargo --version
          rustc --version

      - name: Test diesel_async
        shell: bash
        env:
          BACKEND: ${{ matrix.backend }}
        run: |
          cargo test --manifest-path Cargo.toml --no-default-features -F "$BACKEND" --features "deadpool bb8 mobc async-connection-wrapper migrations"

      - name: Run examples (Postgres)
        if: matrix.backend == 'postgres'
        run: |
          cargo check --manifest-path examples/postgres/pooled-with-rustls/Cargo.toml
          cargo check --manifest-path examples/postgres/run-pending-migrations-with-rustls/Cargo.toml

      - name: Run examples (Sqlite)
        if: matrix.backend == 'sqlite'
        run: |
          cargo check --manifest-path examples/sync-wrapper/Cargo.toml

  rustfmt_and_clippy:
    name: Check rustfmt style && run clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Install rust toolchain
        run: |
          rustup update stable
          rustup override set stable
          rustup component add rustfmt clippy
      - name: Cache cargo registry
        uses: Swatinem/rust-cache@f51f967e158417aafa338a1e46ab22095f07aa01 # v2.8.2
        with:
          key: clippy-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Remove potential newer clippy.toml from dependencies
        run: |
          cargo update
          cargo fetch
          find ~/.cargo/registry -iname "*clippy.toml" -delete

      - name: Run clippy
        run: cargo +stable clippy --all --all-features

      - name: Check formatting
        run: cargo +stable fmt --all -- --check
  minimal_rust_version:
    name: Check Minimal supported rust version (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Install rust toolchain
        run: |
          rustup update stable
          rustup update nightly
      - uses: taiki-e/install-action@60581cd7025e0e855cebd745379013e286d9c787 # v2.64.2
        with:
          tool: cargo-hack, cargo-minimal-versions
      - name: Check diesel-async
        # cannot test mysql yet as that crate
        # has broken min-version dependencies
        # cannot test sqlite yet as that crate
        # as broken min-version dependencies as well
        run: cargo +1.88.0 minimal-versions check -p diesel-async --features "postgres bb8 deadpool mobc"
  all_features_build:
    name: Check all feature combination build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - name: Install rust toolchain
        run: |
          rustup update stable
          rustup override set stable
      - uses: taiki-e/install-action@60581cd7025e0e855cebd745379013e286d9c787 # v2.64.2
        with:
          tool: cargo-hack
      - name: Check feature combinations
        run: cargo hack check --feature-powerset --no-dev-deps --depth 2
