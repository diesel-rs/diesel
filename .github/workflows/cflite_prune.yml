name: ClusterFuzzLite corpus pruning
on:
  schedule:
    - cron: "0 05 * * *" # 05:00 UTC, an hour before batch fuzzing
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
permissions: {}
jobs:
  Pruning:
    name: Prune fuzzing corpus
    runs-on: ubuntu-latest
    permissions:
      contents: write # stores results of the pruning
    steps:
      - name: Build Fuzzers
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@v1
        with:
          language: rust
      - name: Run Fuzzers
        id: run
        uses: google/clusterfuzzlite/actions/run_fuzzers@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: "prune"
          storage-repo: ${{ github.server_url }}/${{ github.repository }}.git
          storage-repo-branch: clusterfuzzlite
