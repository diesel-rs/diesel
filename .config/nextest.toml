[test-groups]
cli_tests = { max-threads = 8 }

[profile.default.junit]
path = "target/junit.xml"
# These are the default values, specified for clarity.
store-success-output = false
store-failure-output = true

[[profile.default.overrides]]
# these are quite heavy so don't run too much of
# those in parallel
filter = 'package(diesel_cli)'
test-group = 'cli_tests'

[[profile.default.overrides]]
# Retry flaky tests:
# - on MySQL/SQLite, `now`/`CURRENT_TIMESTAMP` is statement-bound, so
#   `select(diesel::dsl::now)` and the implicit `CURRENT_TIMESTAMP`
#   default applied by the INSERT can disagree when run as separate
#   statements straddling a second boundary;
# - `insert_get_results_batch` fails sometimes due to a deadlock.
# This is substring matching so `test(insert_get_result)` covers
# `insert_get_results_batch`, and `insert_get_results_batch`.
filter = 'test(insert_get_result) | test(insert_insertable_struct_get_results_batch)'
retries = 2

[profile.mysql]
inherits = 'default'
threads-required = 'num-test-threads'

[[profile.mysql.overrides]]
filter = 'test(types) | test(view_testing) | test(cast::) | test(limit_offset::) | test(transactions::)'
threads-required = 1

[[profile.mysql.overrides]]
filter = 'test(serialize_as::) | test(perf_details::) | test(deserialization::) | test(order::)'
threads-required = 1

[[profile.mysql.overrides]]
filter = 'test(parsing::) | test(infer::) | test(operations::) | test(debug::)'
threads-required = 1

[[profile.mysql.overrides]]
filter = 'package(diesel_tests)'
threads-required = 'num-test-threads'

[[profile.mysql.overrides]]
filter = '(package(diesel_cli) & test(infer_schema_internals))'
threads-required = 'num-test-threads'

[[profile.mysql.overrides]]
filter = 'package(diesel) | package(diesel_*) | package(migrations_macros)'
threads-required = 1